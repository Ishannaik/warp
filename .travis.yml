# Post-merge only. GitHub Actions is the pull request gate.
# Runs on push to main, cron, and manual api builds. Pull requests are skipped:
# forks have no secrets, and the GitHub workflow already checks them.
language: node_js
dist: noble
os: linux

node_js:
  - "22"

cache:
  directories:
    - ~/.local/share/pnpm/store

before_install:
  - nvm install
  - nvm use
  - node --version
  - corepack enable
  - pnpm --version

install:
  - pnpm install --frozen-lockfile

stages:
  - name: build
    if: "branch = main AND type IN (push, cron, api)"
  - name: deploy
    if: 'type = push AND branch = main AND env(WARP_AUTO_DEPLOY) = "1"'
  - name: verify
    if: "branch = main AND type IN (push, cron, api)"

jobs:
  include:
    - stage: build
      name: Lint, typecheck, build, server test
      script:
        - pnpm --filter @warp/web lint
        - pnpm --filter @warp/web typecheck
        - pnpm --filter @warp/web build
        - pnpm --filter @warp/web check:engine
        - pnpm --filter @warp/server test

    - stage: deploy
      name: Deploy Pages and the signaling Worker
      if: 'type = push AND branch = main AND env(WARP_AUTO_DEPLOY) = "1"'
      script:
        - pnpm --filter @warp/web build
        # Use the wrangler pinned in @warp/server; npx from web/ can resolve a stale or newest copy.
        - pnpm --filter @warp/server exec wrangler pages deploy ../web/dist --project-name=wrap --branch=main --commit-dirty=true
        - pnpm --filter @warp/server run deploy

    - stage: verify
      name: Production Playwright
      script:
        - pnpm --filter @warp/web exec playwright install --with-deps chromium webkit
        - WARP_BASE_URL="${WARP_BASE_URL:-https://warp.ishannaik.com}" pnpm --filter @warp/web test:prod

    - stage: verify
      name: BrowserStack desktop and Android
      if: "branch = main AND type IN (push, cron, api) AND env(BROWSERSTACK_USERNAME) IS present"
      script:
        - WARP_BASE_URL="${WARP_BASE_URL:-https://warp.ishannaik.com}" pnpm --filter @warp/web test:browserstack
        - WARP_BASE_URL="${WARP_BASE_URL:-https://warp.ishannaik.com}" pnpm --filter @warp/web test:android
