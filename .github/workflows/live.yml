name: Live site

# Post-merge checks against the DEPLOYED site (default https://warp.ishannaik.com).
# ci.yml gates pull requests on a local build; this catches what only shows up live:
# DNS pointing at the wrong host, a stale deploy, a signaling Worker that drifted.
#
# This mirrors the verify stage in .travis.yml. Travis can't run it yet: the Student
# Pack plan has no credits for public repos. See docs/CI.md.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://warp.ishannaik.com

concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WARP_BASE_URL: ${{ inputs.base_url || 'https://warp.ishannaik.com' }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @warp/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @warp/web test:prod
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-playwright-traces
          path: web/test-results/
          retention-days: 7

  browserstack:
    # One BrowserStack session at a time on this account, so never run beside itself.
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both scripts skip with a message when the secrets are missing (forks).
      - run: pnpm --filter @warp/web test:browserstack
      - run: pnpm --filter @warp/web test:android
